{{- if not .Values.backend.existingSecret }}
{{- $s := .Values.backend.secretEnv }}
{{- $required := list "DJANGO_SECRET_KEY" "POSTGRES_USER" "POSTGRES_PASSWORD" "POSTGRES_DB" }}
{{- if not .Values.postgresql.enabled }}
{{- $required = concat $required (list "POSTGRES_HOST" "POSTGRES_PORT") }}
{{- end }}
{{- if not .Values.redis.enabled }}
{{- $required = append $required "REDIS_URL" }}
{{- end }}
{{- if .Values.minio.enabled }}
{{- $required = concat $required (list "BUCKET_KEY" "BUCKET_SECRET") }}
{{- end }}
{{- range $required }}
{{- if not (index $s .) }}
{{- fail (printf "backend.secretEnv.%s is required (set it in your secrets-<env>.yaml)" .) }}
{{- end }}
{{- end }}
# Chart-managed secret, filled from backend.secretEnv. It is a hook so it exists
# before the migration Job runs on first install.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "care.backendSecretName" . }}
  labels:
    {{- include "care.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $k, $v := $s }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
