{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "care.fullname" . }}
  labels:
    {{- include "care.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.backendHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "care.fullname" . }}-api
                port: { name: http }
    {{- if .Values.frontend.enabled }}
    - host: {{ .Values.ingress.frontendHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "care.fullname" . }}-frontend
                port: { name: http }
    {{- end }}
    {{- range .Values.frontendPlugins }}
    - host: {{ required "frontendPlugins[].host is required" .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "care.pluginName" (dict "ctx" $ "name" .name) }}
                port: { name: http }
    {{- end }}
{{- end }}
