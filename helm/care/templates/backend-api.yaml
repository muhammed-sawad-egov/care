{{- $api := .Values.backend.api -}}
{{- $probeHost := default .Values.ingress.backendHost $api.probeHost -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "care.fullname" . }}-api
  labels:
    {{- include "care.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not $api.autoscaling.enabled }}
  replicas: {{ $api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "care.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "care.selectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
      {{- include "care.backendPodAnnotations" . | nindent 6 }}
    spec:
      {{- include "care.backendPodCommon" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "care.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["bash", "start.sh"]
          ports:
            - name: http
              containerPort: {{ $api.port }}
          {{- include "care.backendEnv" . | nindent 10 }}
          # Host/X-Forwarded-Proto headers keep the probe inside DJANGO_ALLOWED_HOSTS
          # and avoid the SECURE_SSL_REDIRECT 301.
          {{- $probe := dict "path" "/ping/" "port" "http" "httpHeaders" (list (dict "name" "Host" "value" $probeHost) (dict "name" "X-Forwarded-Proto" "value" "https")) }}
          startupProbe:
            httpGet: {{- toYaml $probe | nindent 14 }}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {{- toYaml $probe | nindent 14 }}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {{- toYaml $probe | nindent 14 }}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            {{- toYaml $api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "care.fullname" . }}-api
  labels:
    {{- include "care.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "care.selectorLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if $api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "care.fullname" . }}-api
  labels:
    {{- include "care.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "care.fullname" . }}-api
  minReplicas: {{ $api.autoscaling.minReplicas }}
  maxReplicas: {{ $api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
