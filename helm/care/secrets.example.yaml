# Copy to secrets-<env>.yaml (gitignored) and fill in. Pass it after the values file:
#   helm upgrade --install care helm/care -f helm/care/values-<env>.yaml -f helm/care/secrets-<env>.yaml
# Keys you leave empty or omit are left out of the Secret. Full key list: backend.secretEnv in values.yaml.

backend:
  secretEnv:
    DJANGO_SECRET_KEY: ""
    POSTGRES_USER: ""
    POSTGRES_PASSWORD: ""
    POSTGRES_DB: ""
    # Only when postgresql.enabled / redis.enabled are false (production):
    POSTGRES_HOST: ""
    POSTGRES_PORT: ""
    REDIS_URL: ""
    JWKS_BASE64: ""
    BUCKET_KEY: ""
    BUCKET_SECRET: ""
    DVDMS_API_ENDPOINT: ""
    DVDMS_AUTH_TOKEN: ""
