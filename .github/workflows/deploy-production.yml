name: Deploy Care Production (Helm)

# Flow: push to `production` -> build & push image -> wait for approval
# (GitHub Environment "production" with required reviewers) -> helm upgrade.
# Manual run with `image_tag` redeploys an existing image (e.g. rollback).

on:
  push:
    branches:
      - production
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing backend image tag to deploy (skips build). Leave empty to build HEAD."
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  RELEASE_NAME: care
  NAMESPACE: care
  HELM_VERSION: v3.16.4

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: inputs.image_tag == ''
    name: Build & push image
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute tag
        id: vars
        run: echo "tag=production-${GITHUB_SHA::7}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod.Dockerfile
          # Add linux/arm64 if your cluster nodes are ARM.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
            ${{ env.IMAGE }}:production-latest
          build-args: |
            APP_VERSION=${{ github.sha }}
            ADDITIONAL_PLUGS=${{ vars.ADDITIONAL_PLUGS }}
            PLUGINS_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod

  deploy:
    needs: build
    # Run after a successful build, or directly when a tag was given manually.
    if: always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.image_tag != ''))
    name: Deploy to production
    runs-on: ubuntu-24.04
    # Configure required reviewers on this environment in
    # Settings -> Environments -> production. The job pauses here until approved.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_API_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Resolve image tags
        id: tags
        run: |
          BACKEND_TAG="${{ inputs.image_tag || needs.build.outputs.tag }}"
          # Keep whatever frontend tag is currently deployed; the care_fe workflow owns it.
          FRONTEND_TAG=$(helm get values "$RELEASE_NAME" -n "$NAMESPACE" -o json 2>/dev/null \
            | jq -r '.frontend.image.tag // empty')
          echo "backend=$BACKEND_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend=${FRONTEND_TAG:-production-latest}" >> "$GITHUB_OUTPUT"

      - name: Write secret values
        env:
          # Environment secret: the contents of helm/care/secrets-production.yaml.
          HELM_SECRETS_YAML: ${{ secrets.HELM_SECRETS_YAML }}
        run: |
          umask 077
          printf '%s\n' "$HELM_SECRETS_YAML" > "$RUNNER_TEMP/secrets-production.yaml"

      - name: Helm upgrade
        run: |
          helm upgrade --install "$RELEASE_NAME" helm/care \
            --namespace "$NAMESPACE" --create-namespace \
            -f helm/care/values-production.yaml \
            -f "$RUNNER_TEMP/secrets-production.yaml" \
            --set backend.image.tag="${{ steps.tags.outputs.backend }}" \
            --set frontend.image.tag="${{ steps.tags.outputs.frontend }}" \
            --atomic --wait --timeout 15m --history-max 10

      - name: Summary
        run: |
          {
            echo "### Production deploy"
            echo "- backend: \`$IMAGE:${{ steps.tags.outputs.backend }}\`"
            echo "- frontend tag: \`${{ steps.tags.outputs.frontend }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
