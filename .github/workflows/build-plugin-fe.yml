name: Build plugin frontend image

# Reusable workflow, called from each care_*_fe plugin repo (see its .github/workflows/image.yml).
# Builds the calling repo with docker/plugin-fe/Dockerfile from this repo and pushes
# ghcr.io/<calling repo>. Deploying is separate: pin the pushed tag under
# frontendPlugins in helm/care/values-production.yaml.

on:
  workflow_call:
    inputs:
      push:
        description: "Push the image (false = build only, e.g. for PRs)."
        type: boolean
        default: true
      care_ref:
        description: "Ref of care-ecosystem/care to take docker/plugin-fe/ from."
        type: string
        default: develop
      platforms:
        description: "Add linux/arm64 if your cluster nodes are ARM."
        type: string
        default: linux/amd64
    outputs:
      tag:
        description: "Immutable image tag (sha-<short sha>) to pin in Helm values."
        value: ${{ jobs.build.outputs.tag }}

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      # Without `repository`, checkout takes the calling (plugin) repo at the triggering ref.
      - uses: actions/checkout@v5
        with:
          path: plugin

      - uses: actions/checkout@v5
        with:
          repository: care-ecosystem/care
          ref: ${{ inputs.care_ref }}
          path: care
          sparse-checkout: docker/plugin-fe
          sparse-checkout-cone-mode: false

      - name: Compute image name and tag
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: plugin
          # Dockerfile.dockerignore next to the Dockerfile applies to the plugin context.
          file: care/docker/plugin-fe/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=plugin-fe
          cache-to: type=gha,mode=max,scope=plugin-fe

      - name: Summary
        if: inputs.push
        run: |
          {
            echo "### Plugin frontend image"
            echo "- \`${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}\`"
            echo
            echo "Pin it in care's \`helm/care/values-production.yaml\` under \`frontendPlugins\`."
          } >> "$GITHUB_STEP_SUMMARY"
