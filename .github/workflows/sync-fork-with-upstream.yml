name: Sync Fork with Upstream

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Add upstream
        run: git remote add upstream https://github.com/ohcnetwork/care.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          if git diff --quiet develop upstream/develop 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes from upstream; nothing to do"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Upstream changes detected"
          fi

      - name: Save custom workflows
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir -p /tmp/saved-workflows
          cp .github/workflows/sync-fork-with-upstream.yml /tmp/saved-workflows/ 2>/dev/null || true
          cp .github/workflows/docker-build.yml /tmp/saved-workflows/ 2>/dev/null || true

      - name: Reset to upstream
        if: steps.check.outputs.changed == 'true'
        run: git checkout develop && git reset --hard upstream/develop

      - name: Restore custom workflows
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir -p .github/workflows
          cp /tmp/saved-workflows/sync-fork-with-upstream.yml .github/workflows/ 2>/dev/null || true
          cp /tmp/saved-workflows/docker-build.yml .github/workflows/ 2>/dev/null || true

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git add .github/workflows/
          git commit -m "Restore custom workflows after upstream sync" || true
          git push origin develop --force
